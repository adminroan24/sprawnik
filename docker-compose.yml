services:
  db:
    image: postgres:17-alpine
    container_name: sprawnik-db
    environment:
      POSTGRES_DB: sprawnik
      POSTGRES_USER: sprawnik
      POSTGRES_PASSWORD: sprawnik
    ports:
      - "5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprawnik -d sprawnik"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
